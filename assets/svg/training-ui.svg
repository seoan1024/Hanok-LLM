<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Hanok LLM training pipeline</title><desc id="desc">Animated flow from source data through pretraining and LoRA SFT into a native checkpoint.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset=".55" stop-color="#10182a"/><stop offset="1" stop-color="#10131f"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#465dff" stop-opacity=".23"/><stop offset="1" stop-color="#465dff" stop-opacity="0"/></radialGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#60f0d0"/><stop offset="1" stop-color="#42b9ff"/></linearGradient>
 <linearGradient id="violet" x2="1"><stop stop-color="#8f79ff"/><stop offset="1" stop-color="#cf77ff"/></linearGradient>
 <linearGradient id="amber" x2="1"><stop stop-color="#ffc86d"/><stop offset="1" stop-color="#ff8d79"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9bb0de" stroke-opacity=".065" stroke-width=".7"/><circle cx="0" cy="0" r="1" fill="#99b5f8" fill-opacity=".22"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
 </defs>
 <rect width="1200" height="480" rx="24" fill="url(#bg)"/><rect width="1200" height="480" rx="24" fill="url(#grid)"/>
 <circle cx="930" cy="220" r="300" fill="url(#aura)"/><path d="M0 1H1200" stroke="url(#cyan)" stroke-width="2" opacity=".9"/>
 <g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="60" y="53" fill="#61e9ce" font-size="12" font-weight="700" letter-spacing="3">02 / TRAINING FLOW</text><text x="60" y="112" fill="#f4f7ff" font-size="40" font-weight="750">Data in. Checkpoints out.</text><text x="62" y="142" fill="#aab6d0" font-size="15">A staged workflow with visible handoffs and recoverable runs.</text>
<!-- timeline rail --> <path d="M113 267H1088" stroke="#273650" stroke-width="10" stroke-linecap="round"/><path d="M113 267H1088" stroke="url(#cyan)" stroke-width="2" stroke-dasharray="8 11" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-38" dur="2.6s" repeatCount="indefinite"/></path>
<g><rect x="60" y="192" width="188" height="141" rx="16" fill="#121c30" stroke="#344767"/><text x="78" y="221" fill="#60e4cd" font-size="10" font-weight="700" letter-spacing="1.5">SOURCE</text><text x="78" y="252" fill="#f4f7ff" font-size="16" font-weight="700">Korean web text</text><text x="78" y="279" fill="#91a2c2" font-size="12">eliceai default</text><path d="M78 305H220" stroke="#2f405e"/><text x="78" y="324" fill="#7184a6" font-size="10">DATASET →</text>
<rect x="284" y="192" width="188" height="141" rx="16" fill="#121c30" stroke="#344767"/><text x="302" y="221" fill="#60e4cd" font-size="10" font-weight="700" letter-spacing="1.5">PREPARE</text><text x="302" y="252" fill="#f4f7ff" font-size="16" font-weight="700">Cache + pack</text><text x="302" y="279" fill="#91a2c2" font-size="12">Parquet · 1,024 tokens</text><path d="M302 305H444" stroke="#2f405e"/><text x="302" y="324" fill="#7184a6" font-size="10">TOKENS →</text>
<rect x="508" y="192" width="188" height="141" rx="16" fill="#151d39" stroke="#5167ce"/><text x="526" y="221" fill="#94a4ff" font-size="10" font-weight="700" letter-spacing="1.5">STAGE 01</text><text x="526" y="252" fill="#f4f7ff" font-size="16" font-weight="700">Pretraining</text><text x="526" y="279" fill="#a7b2dc" font-size="12">100,000 steps default</text><path d="M526 305H668" stroke="#354676"/><text x="526" y="324" fill="#8797ca" font-size="10">BASE MODEL →</text>
<rect x="732" y="192" width="188" height="141" rx="16" fill="#211b37" stroke="#7153a6"/><text x="750" y="221" fill="#ca9aff" font-size="10" font-weight="700" letter-spacing="1.5">STAGE 02</text><text x="750" y="252" fill="#f4f7ff" font-size="16" font-weight="700">SFT + LoRA</text><text x="750" y="279" fill="#b9a7d5" font-size="12">BCCard + identity</text><path d="M750 305H892" stroke="#49365f"/><text x="750" y="324" fill="#a58abd" font-size="10">10,000 STEPS →</text>
<rect x="956" y="192" width="184" height="141" rx="16" fill="#142521" stroke="#347e70"/><text x="974" y="221" fill="#60e4cd" font-size="10" font-weight="700" letter-spacing="1.5">ARTIFACT</text><text x="974" y="252" fill="#f4f7ff" font-size="16" font-weight="700">Native .pth</text><text x="974" y="279" fill="#9bbeb8" font-size="12">Resume · infer · export</text><path d="M974 305H1116" stroke="#315b57"/><text x="974" y="324" fill="#72b6a7" font-size="10">CHECKPOINT</text></g>
<circle r="8" fill="#f7fbff" stroke="#61e9ce" stroke-width="3" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" path="M92 267 H1108"/></circle>
<text x="62" y="394" fill="#8796b3" font-size="12">Defaults: batch 2 × accumulation 16 · warmup 1,000 · cosine schedule · optional GUI monitor</text>
<g transform="translate(910 382)"><circle cx="0" cy="0" r="3" fill="#60e4cd"/><text x="12" y="4" fill="#6f809f" font-size="10">CONFIGURED PIPELINE</text></g></g></svg>