<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Hanok configurable model architecture</title>
<desc id="desc">A configurable decoder-only Transformer with variable vocabulary, hidden size, layer count, attention heads, and feed-forward width.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#61e9ce"/><stop offset="1" stop-color="#9b7cff"/></linearGradient></defs>
<rect width="1200" height="480" rx="24" fill="#080e1b"/><text x="60" y="62" fill="#61e9ce" font-family="Arial" font-size="13" font-weight="700" letter-spacing="3">01 / CONFIGURABLE ARCHITECTURE</text>
<text x="60" y="118" fill="#f4f7ff" font-family="Arial" font-size="40" font-weight="700">A model that scales with your goal</text>
<text x="62" y="150" fill="#aab6d0" font-family="Arial" font-size="16">Decoder-only Transformer · RMSNorm · RoPE · SwiGLU · tied or untied vocabulary projection</text>
<g font-family="Arial" text-anchor="middle"><g fill="#17233a" stroke="#61e9ce" stroke-width="2"><rect x="70" y="220" width="150" height="76" rx="14"/><rect x="270" y="220" width="150" height="76" rx="14"/><rect x="470" y="205" width="260" height="106" rx="16"/><rect x="780" y="220" width="150" height="76" rx="14"/><rect x="980" y="220" width="150" height="76" rx="14"/></g><g fill="#f4f7ff" font-size="16" font-weight="700"><text x="145" y="264">INPUT TOKENS</text><text x="345" y="264">EMBEDDING</text><text x="600" y="250">TRANSFORMER</text><text x="600" y="274">BLOCK × N</text><text x="855" y="264">FINAL NORM</text><text x="1055" y="264">VOCAB LOGITS</text></g><g fill="#9fb0cf" font-size="12"><text x="600" y="298">dim · heads · FFN width are configurable</text></g></g>
<g stroke="url(#g)" stroke-width="3" fill="none"><path d="M220 258H270M420 258H470M730 258H780M930 258H980"/><path d="M345 296Q600 390 855 296" stroke-dasharray="7 8"/></g>
<rect x="70" y="378" width="1060" height="48" rx="12" fill="#151e31" stroke="#2b3a5a"/><g fill="#cbd7ec" font-family="Arial" font-size="14"><text x="94" y="408">VOCABULARY: 30,004 (fixed)</text><text x="360" y="408">LAYERS: configurable</text><text x="590" y="408">HIDDEN / HEADS: configurable</text><text x="900" y="408">KV CACHE · EXPORT</text></g></svg>
