<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Hanok LLM — a Korean-first model lab</title><desc id="desc">Animated model overview with a layered neural core, orbiting data paths, and project scope.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset=".55" stop-color="#10182a"/><stop offset="1" stop-color="#10131f"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#465dff" stop-opacity=".23"/><stop offset="1" stop-color="#465dff" stop-opacity="0"/></radialGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#60f0d0"/><stop offset="1" stop-color="#42b9ff"/></linearGradient>
 <linearGradient id="violet" x2="1"><stop stop-color="#8f79ff"/><stop offset="1" stop-color="#cf77ff"/></linearGradient>
 <linearGradient id="amber" x2="1"><stop stop-color="#ffc86d"/><stop offset="1" stop-color="#ff8d79"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9bb0de" stroke-opacity=".065" stroke-width=".7"/><circle cx="0" cy="0" r="1" fill="#99b5f8" fill-opacity=".22"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
 </defs>
 <rect width="1200" height="480" rx="24" fill="url(#bg)"/><rect width="1200" height="480" rx="24" fill="url(#grid)"/>
 <circle cx="930" cy="220" r="300" fill="url(#aura)"/><path d="M0 1H1200" stroke="url(#cyan)" stroke-width="2" opacity=".9"/>
 <g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="60" y="55" fill="#61e9ce" font-size="12" font-weight="700" letter-spacing="3">HANOK / KOREAN LANGUAGE MODEL LAB</text><text x="60" y="127" fill="#f4f7ff" font-size="52" font-weight="750" letter-spacing="-1.4">Build. Train. Understand.</text><text x="62" y="163" fill="#aab6d0" font-size="17">A modular PyTorch stack for exploring Korean language models.</text>
<rect x="62" y="210" width="388" height="1" fill="#60708f" opacity=".5"/><text x="62" y="248" fill="#f4f7ff" font-size="16" font-weight="700">33 BLOCKS</text><text x="188" y="248" fill="#8594b3" font-size="14">1,280 hidden · 10 attention heads</text><text x="62" y="289" fill="#f4f7ff" font-size="16" font-weight="700">PRETRAIN → SFT</text><text x="218" y="289" fill="#8594b3" font-size="14">rank-64 LoRA · native checkpoints</text><text x="62" y="330" fill="#f4f7ff" font-size="16" font-weight="700">INFER → EVALUATE → EXPORT</text><text x="62" y="356" fill="#8594b3" font-size="14">Tools and paths are included; weights are not.</text>
<rect x="62" y="395" width="190" height="31" rx="15" fill="#19243a" stroke="#334568"/><circle cx="80" cy="410" r="4" fill="#61e9ce"><animate attributeName="opacity" values=".35;1;.35" dur="2.1s" repeatCount="indefinite"/></circle><text x="94" y="415" fill="#b5c4e2" font-size="11" letter-spacing="1">PYTORCH · LOCAL FIRST</text>
<!-- luminous transformer shrine -->
<ellipse cx="900" cy="248" rx="226" ry="181" fill="none" stroke="#465b88" stroke-opacity=".28"/><ellipse cx="900" cy="248" rx="188" ry="148" fill="none" stroke="#7c72ff" stroke-opacity=".25" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0 900 248" to="360 900 248" dur="36s" repeatCount="indefinite"/></ellipse>
<path d="M672 176Q786 82 900 171Q1014 82 1128 176" fill="none" stroke="#a4b2d7" stroke-width="4" stroke-linecap="round"/><path d="M690 183H1110" stroke="url(#cyan)" stroke-width="2" stroke-dasharray="12 7" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-38" dur="3s" repeatCount="indefinite"/></path>
<path d="M713 194V316H1087V194M750 194V316M800 194V316M850 194V316M900 194V316M950 194V316M1000 194V316M1050 194V316" fill="none" stroke="#8396bc" stroke-opacity=".45" stroke-width="1.4"/>
<rect x="794" y="210" width="212" height="89" rx="18" fill="#111d32" stroke="#68e8d4" stroke-width="1.5"/><rect x="804" y="220" width="192" height="69" rx="12" fill="#172643"/><text x="900" y="249" text-anchor="middle" fill="#f5f7ff" font-size="15" font-weight="700" letter-spacing="2">HANOK CORE</text><text x="900" y="274" text-anchor="middle" fill="#8ea4ca" font-size="12">attention · memory · language</text>
<path d="M717 344Q900 414 1083 344M755 363Q900 414 1045 363" fill="none" stroke="#52628a" stroke-width="1"/><g fill="#5ff0cf" filter="url(#glow)"><circle r="5"><animateMotion dur="7s" repeatCount="indefinite" path="M710 336 C778 400 1016 400 1090 336 C1016 278 778 278 710 336"/></circle><circle r="3.5"><animateMotion dur="9s" repeatCount="indefinite" path="M1090 153 C1010 102 787 102 710 153 C787 205 1010 205 1090 153"/></circle></g>
<circle cx="1081" cy="116" r="5" fill="#ffae78" filter="url(#glow)"><animate attributeName="r" values="3;7;3" dur="2.7s" repeatCount="indefinite"/></circle><text x="60" y="458" fill="#667491" font-size="11">No trained weights or benchmark scores are included.</text></g></svg>