<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Project status, clearly stated</title><desc id="desc">Animated status dashboard showing implementation, absent weights, and benchmark limits.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset=".55" stop-color="#10182a"/><stop offset="1" stop-color="#10131f"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#465dff" stop-opacity=".23"/><stop offset="1" stop-color="#465dff" stop-opacity="0"/></radialGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#60f0d0"/><stop offset="1" stop-color="#42b9ff"/></linearGradient>
 <linearGradient id="violet" x2="1"><stop stop-color="#8f79ff"/><stop offset="1" stop-color="#cf77ff"/></linearGradient>
 <linearGradient id="amber" x2="1"><stop stop-color="#ffc86d"/><stop offset="1" stop-color="#ff8d79"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9bb0de" stroke-opacity=".065" stroke-width=".7"/><circle cx="0" cy="0" r="1" fill="#99b5f8" fill-opacity=".22"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
 </defs>
 <rect width="1200" height="480" rx="24" fill="url(#bg)"/><rect width="1200" height="480" rx="24" fill="url(#grid)"/>
 <circle cx="930" cy="220" r="300" fill="url(#aura)"/><path d="M0 1H1200" stroke="url(#cyan)" stroke-width="2" opacity=".9"/>
 <g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="60" y="53" fill="#61e9ce" font-size="12" font-weight="700" letter-spacing="3">04 / PROJECT STATUS</text><text x="60" y="112" fill="#f4f7ff" font-size="40" font-weight="750">What is ready. What is not.</text><text x="62" y="142" fill="#aab6d0" font-size="15">Implementation status and model-quality evidence are tracked separately.</text>
<!-- three independent evidence panels -->
<g><rect x="60" y="185" width="337" height="230" rx="17" fill="#111b2c" stroke="#354966"/><rect x="60" y="185" width="337" height="4" rx="2" fill="url(#cyan)"/><text x="84" y="221" fill="#61e9ce" font-size="10" font-weight="700" letter-spacing="2">AVAILABLE</text><text x="84" y="259" fill="#f4f7ff" font-size="22" font-weight="700">Implementation</text><text x="84" y="287" fill="#97a8c8" font-size="13">Train · infer · evaluate · export</text><path d="M84 310H373" stroke="#2a3955"/><g fill="#61e9ce"><circle cx="91" cy="337" r="4"/><circle cx="91" cy="362" r="4"/><circle cx="91" cy="387" r="4"/></g><g fill="#c0cce0" font-size="12"><text x="106" y="341">Native PyTorch model</text><text x="106" y="366">Checkpoint and resume</text><text x="106" y="391">HF / GGUF / Ollama paths</text></g><circle cx="349" cy="220" r="9" fill="#61e9ce" opacity=".12"><animate attributeName="r" values="7;12;7" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="349" cy="220" r="3" fill="#61e9ce" filter="url(#glow)"/></g>
<g><rect x="431" y="185" width="337" height="230" rx="17" fill="#111b2c" stroke="#493a52"/><rect x="431" y="185" width="337" height="4" rx="2" fill="url(#amber)"/><text x="455" y="221" fill="#ffae84" font-size="10" font-weight="700" letter-spacing="2">NOT BUNDLED</text><text x="455" y="259" fill="#f4f7ff" font-size="22" font-weight="700">Model weights</text><text x="455" y="287" fill="#97a8c8" font-size="13">No trained checkpoint in this repository.</text><path d="M455 310H744" stroke="#2a3955"/><rect x="455" y="334" width="288" height="48" rx="10" fill="#241e2b" stroke="#5a4145"/><path d="M474 352V361M474 367V368" stroke="#ff9f7f" stroke-width="3" stroke-linecap="round"/><text x="493" y="364" fill="#d2b8b5" font-size="12">Export requires your checkpoint.</text><path d="M731 211L747 227M747 211L731 227" stroke="#ff9f7f" stroke-width="2" opacity=".8"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></path></g>
<g><rect x="802" y="185" width="338" height="230" rx="17" fill="#111b2c" stroke="#3e3b61"/><rect x="802" y="185" width="338" height="4" rx="2" fill="url(#violet)"/><text x="826" y="221" fill="#b39aff" font-size="10" font-weight="700" letter-spacing="2">NOT CLAIMED</text><text x="826" y="259" fill="#f4f7ff" font-size="22" font-weight="700">Quality scores</text><text x="826" y="287" fill="#97a8c8" font-size="13">No official Korean benchmark result.</text><path d="M826 310H1116" stroke="#2a3955"/><path d="M832 377L866 353L896 368L927 337L956 350L988 321" fill="none" stroke="#a987ff" stroke-width="2" stroke-dasharray="4 7"><animate attributeName="stroke-dashoffset" values="0;-22" dur="2.5s" repeatCount="indefinite"/></path><path d="M826 383H1116" stroke="#35415c"/><text x="1005" y="362" fill="#907ea9" font-size="10">sanity suite</text><text x="826" y="401" fill="#7789aa" font-size="11">Small regression check only</text></g>
<text x="62" y="455" fill="#7183a4" font-size="11">Validation environment: RTX 5090 Laptop GPU</text></g></svg>
