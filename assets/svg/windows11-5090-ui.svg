<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Validated RTX 5090 Laptop workstation</title><desc id="desc">A workstation profile validated on an RTX 5090 Laptop GPU.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset=".55" stop-color="#10182a"/><stop offset="1" stop-color="#10131f"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#465dff" stop-opacity=".23"/><stop offset="1" stop-color="#465dff" stop-opacity="0"/></radialGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#60f0d0"/><stop offset="1" stop-color="#42b9ff"/></linearGradient>
 <linearGradient id="violet" x2="1"><stop stop-color="#8f79ff"/><stop offset="1" stop-color="#cf77ff"/></linearGradient>
 <linearGradient id="amber" x2="1"><stop stop-color="#ffc86d"/><stop offset="1" stop-color="#ff8d79"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9bb0de" stroke-opacity=".065" stroke-width=".7"/><circle cx="0" cy="0" r="1" fill="#99b5f8" fill-opacity=".22"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
 </defs>
 <rect width="1200" height="480" rx="24" fill="url(#bg)"/><rect width="1200" height="480" rx="24" fill="url(#grid)"/>
